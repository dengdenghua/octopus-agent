# Octopus desktop packaging config (electron-builder).
#
# 打包依赖：electron-builder 与 electron-updater 已作为 frontend/ 的
# devDependencies 安装（pnpm add -D electron-builder electron-updater）。
#
# 解析基准：electron-builder 在 REPO_ROOT/frontend 下执行（打包脚本位于
# frontend/package.json），因此 files / extraResources 的相对路径均以
# frontend/ 为基准。frontend 目录中已包含 dist/ 与 electron/。
#
# 约定：
#   - main 入口指向 frontend/electron/main.cjs（frontend/package.json 的
#     "main" 字段，electron-builder 据此打包入口）。
#   - extraResources 把用户首次启动所需的 config.desktop.yaml 与 Python
#     后端代码（repo 根 runtime/）放入 resources/，供 main.cjs 打包模式托管。

appId: com.octopus.desktop
productName: Octopus
copyright: Octopus Authors

# 说明：main 入口由 frontend/package.json 的 "main" 字段决定
# （值：electron/main.cjs）。此处仅注释备忘，避免重复声明产生歧义。

directories:
  output: release
  buildResources: ../packaging/desktop

# 打包进 app 的文件（相对 frontend/）。dist 为 Vite 产物，electron 为主进程。
# 注意：electron-builder 默认总会附带 package.json 与生产依赖 node_modules。
files:
  - dist/**/*
  - electron/**/*
  - "!**/*.map"

# 额外资源：放入应用 resources/ 目录（打包后 process.resourcesPath 下一级）。
# main.cjs 的 ensureDesktopConfig() 已按此约定从 resources 读取 config.desktop.yaml。
# uv/ 是 uv-managed 运行时引导器（backend-runtime.cjs 优先用它建 venv + 装依赖）。
# runtime/ 是后端源码，pyproject.toml 供按需安装可选依赖时解析 extras。
extraResources:
  - from: ../packaging/desktop/config.desktop.yaml
    to: config.desktop.yaml
  - from: ../runtime
    to: runtime
  - from: ../pyproject.toml
    to: pyproject.toml
  # uv 二进制（按平台放入 frontend/uv_bin/${os}/ 后由打包脚本拷入）。
  # electron-builder 的 ${os} 宏展开为 mac / win / linux，与 frontend/uv_bin 下的
  # 目录名一一对应。未提供时 backend-runtime.cjs 回退到系统 PATH 上的 uv。
  # 获取方式示例：
  #   curl -LsSf https://astral.sh/uv/install.sh | sh      # 复制 CLI 到 uv_bin/${os}/
  - from: uv_bin/${os}
    to: uv
    filter:
      - "**/*"

# 目标平台
mac:
  target:
    - dmg
  category: public.app-category.developer-tools

win:
  target:
    - nsis

linux:
  target:
    - AppImage
  category: Development

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# 自动更新源：启用 electron-updater 后在此配置发布源。
# 可选：GitHub Releases（type: github）或自托管 generic。
#   示例（GitHub）：
#   publish:
#     provider: github
#     owner: octopus-agent
#     repo: octopus-agent
#   示例（自托管）：
#   publish:
#     provider: generic
#     url: https://updates.example.com/octopus
# 未配置则打包产物不包含 app-update.yml，checkForUpdates 会报“无更新源”。