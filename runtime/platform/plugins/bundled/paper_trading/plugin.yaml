name: paper_trading
display_name: 模拟炒股
version: 0.4.0
description: 模拟炒股练习插件 — 本地模拟交易面板 + 「平台交易」页对接平台配资盘(申请资金/合约/持仓/真实买卖委托,全部二次确认),可选只读接入平台实时大盘。纯个人练习用。
author: Octopus
tags:
  - trading
  - paper-trading
  - simulation
  - practice
provides:
  - paper_trading.api
  - paper_trading.page
  - paper_trading.skills
config:
  initial_cash: 1000000.0
  data_dir: ~/.octopus/data/paper_trading
  live_mode: false
  base_url: http://114.66.32.152:58868/api
  live_ttl: 30
  credentials_file: ~/.octopus/data/paper_trading/credentials.json
  auto_trade: false
  proxy_origin: false
  allow_same_origin_third_party_scripts: false
config_schema:
  type: object
  properties:
    initial_cash:
      type: number
      title: 初始模拟资金
      description: 首次启动时分配的模拟资金(元)
      default: 1000000
    data_dir:
      type: string
      title: 状态持久化目录
      description: 账户/持仓/成交记录 JSON 的落盘目录(默认 ~/.octopus/data/paper_trading)
    live_mode:
      type: boolean
      title: 平台实时行情
      description: 默认关闭。开启后只读拉取平台后端真实大盘(指数/涨跌家数/市场状态),不进行任何交易；仅接受 HTTPS 上游，认证或多用户部署会禁用整个账户集成
      default: false
    base_url:
      type: string
      title: 平台 API 地址
      description: 平台 API 根地址；启用 live_mode、auto_trade 或同源代理时必须配置可信 HTTPS 地址
    live_ttl:
      type: number
      title: 实时行情缓存秒数
      description: 页面每 2s 刷新,按此秒数合并对平台的请求(默认 30)
      default: 30
    credentials_file:
      type: string
      title: 凭证文件
      description: "{phone, password} JSON 文件路径(可选,也可用环境变量 PAPER_TRADING_PHONE/PAPER_TRADING_PASSWORD)"
    auto_trade:
      type: boolean
      title: 自动交易(agent/程序化下单)
      description: "默认 false:真实下单必须人工在页面二次确认;设为 true 后启用 paper_trading.trade skill,允许 agent 直接向平台自动下单(带 confirm 授权)。开启有风险,请谨慎。"
      default: false
    proxy_origin:
      type: boolean
      title: 平台原站同源反代(嵌入原版网页)
      description: "默认 false。仅当此项和 allow_same_origin_third_party_scripts 都为 true、且 base_url 使用 HTTPS 时才会挂载。该功能会让第三方脚本运行在本应用 origin 下，仅限可信的单用户本地环境。"
      default: false
    allow_same_origin_third_party_scripts:
      type: boolean
      title: 允许第三方脚本使用应用同源权限(危险)
      description: "独立的高风险确认开关。开启前必须确认上游可信；第三方脚本可能访问父页面会话并以当前用户身份调用 API。生产或多用户部署不得开启。"
      default: false
