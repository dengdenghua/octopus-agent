# octopus-agent · 最小部署栈
# 仅 agent 单进程 · 适用于开发 / 测试 / 低负载场景
#
# 启动:
#   docker compose up -d
#   docker compose logs -f
#   docker compose down
#
# 需要跨进程事件总线（Redis / NATS）请使用:
#   docker compose -f docker-compose.full.yml up -d
#
# 初次使用:
#   1. cp config.example.yaml config.yaml  # 复制并编辑配置
#   2. 设置环境变量 ANTHROPIC_API_KEY
#   3. mkdir -p data/

services:
  octopus-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: octopus-agent:latest
    container_name: octopus-agent
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: octopus-agent
      OCTOPUS_LOG_LEVEL: ${OCTOPUS_LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data
      - ./config.yaml:/etc/octopus/config.yaml:ro
    command:
      - serve
      - --config
      - /etc/octopus/config.yaml
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --learn-interval
      - "${LEARN_INTERVAL_S:-0}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"