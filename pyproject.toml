[project]
name = "octopus-agent"
version = "0.2.0"
description = "Biomimetic self-evolving agent OS."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{name = "octopus-agent contributors"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "pydantic>=2.12.0",
]

[project.optional-dependencies]
minimal = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.2",
    "ruff>=0.5.0,<1.0",
    # starlette >=1.3 moved TestClient onto the httpx2 package; without it
    # every TestClient-based test errors at import on fresh CI installs.
    "httpx2>=2.0",
    # `make security` invokes these as bare commands; declare them so a clean
    # `make install` provides them instead of the gate silently no-opping.
    "bandit>=1.7",
    "pip-audit>=2.7",
]
tracing = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]
local-auth = [
    "bcrypt>=4.0",
]
serve = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]
# ── Web skills · httpx-gated ─────────────────────────────
web = [
    "httpx>=0.27",
]
# ── Web content extraction (Readability-style main content) ─
extract = [
    "trafilatura>=2.0",
]
# ── File Agent / 数字资产管家 · the octopus-storage document KB ──
# octopus-storage stays an INDEPENDENT package (it serves File Agent for the
# whole family and carries heavy OCR / vision / embedding deps), but it ships
# through the SAME index as a one-command pull: `pip install "octopus-agent[storage]"`.
# Its console script then lands on PATH, so OCTOPUS_STORAGE_AUTOSTART can
# co-launch it. For a source checkout: `pip install -e ../octopus-storage`.
storage = [
    "octopus-storage>=0.1.0",
]
# ── LLM provider adapters ────────────────────────────────
anthropic = [
    "anthropic>=0.40,<1.0",
]
# ── MCP client ───────────────────────────────────────────
mcp = [
    "mcp>=0.9,<2.0",
]
# ── Browser skills ───────────────────────────────────────
browser = [
    "playwright>=1.48",
]
# ── Desktop / computer use skills ────────────────────────
desktop = [
    "pyautogui>=0.9.54",
    "pillow>=10.0",
    "uiautomation>=2.0; platform_system == 'Windows'",
]
# ── Code intelligence (AST code_search / code_edit) ──────
code-intel = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
]
discord = [
    "cryptography>=42.0",
]
channels = [
    "httpx>=0.27",
    "cryptography>=42.0",
]
mantle-ssh = [
    "paramiko>=3.0",
]
hearts-redis = [
    "redis>=5.0",
]
hearts-etcd = [
    # etcd3 包已停止维护,改用 etcd3-py(活跃维护,兼容 Python 3.12+)
    "etcd3-py>=0.2",
]
skin = [
    "watchdog>=4.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.8",
]
all = [
    # serve
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    # web / IM
    "httpx>=0.27",
    # LLM providers
    "anthropic>=0.40,<1.0",
    # MCP client
    "mcp>=0.9,<2.0",
    # browsers
    "playwright>=1.48",
    # desktop
    "pyautogui>=0.9.54",
    "pillow>=10.0",
    "uiautomation>=2.0; platform_system == 'Windows'",
    # code intelligence (AST)
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    # observability
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    # Implementation note.
    "cryptography>=42.0",
    # Implementation note.
    "paramiko>=3.0",
    "redis>=5.0",
    "watchdog>=4.0",
    # local-auth
    "bcrypt>=4.0",
    # web content extraction
    "trafilatura>=2.0",
    # hearts-etcd
    "etcd3-py>=0.2",
]

[project.urls]
Homepage = "https://github.com/octopus-agent/octopus-agent"
Documentation = "https://github.com/octopus-agent/octopus-agent/blob/main/README.md"
Repository = "https://github.com/octopus-agent/octopus-agent"
Issues = "https://github.com/octopus-agent/octopus-agent/issues"
Changelog = "https://github.com/octopus-agent/octopus-agent/blob/main/CHANGELOG.md"

# ─── Single source of truth for the canonical repo URL ──────────
# All other files (frontend/package.json, mkdocs.yml, install.sh,
# permissions.example.json, the in-app About page, the in-app
# GITHUB_URL constant, …) MUST match this value. CI enforces this via
# tools/lint/repo_url_check.py. To move the project to a new home,
# change this one line and re-run the linter.
[tool.octopus]
repo_url = "https://github.com/octopus-agent/octopus-agent"

[project.scripts]
octopus-lint = "tools.lint.invariant_check:main"
octopus = "runtime.cli:main"
octopus-agent = "runtime.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime*", "tools*"]
exclude = ["tests*", "*.fixtures*"]

# ─── pytest ──────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--timeout=60",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: end-to-end integration tests",
]

# ─── ruff ────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "tools/lint/fixtures",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "SIM", "RET"]
ignore = [
    "E501",  # line too long (由 formatter 管)
    "N818",  # exception naming (InvariantViolation 不加 Error 后缀)
]

[tool.ruff.lint.per-file-ignores]
# realtime_cerebrum.py re-imports split-module helpers at the bottom
# under their original names for backward compat. They can't move to
# the top: realtime_react_stream.py imports FROM realtime_cerebrum,
# so a top-of-file import here would be circular.
"runtime/sensing/gateway/realtime_cerebrum.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

# ─── coverage ────────────────────────────────────────
[tool.coverage.run]
source = ["runtime", "tools"]
omit = ["*/tests/*", "*/fixtures/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
