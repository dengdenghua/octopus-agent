name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every gate below carries `if: always()` on purpose. Steps run in order and
  # a failing step normally skips the rest, so one red style ratchet (the
  # god-file line-count check, a ruff nit) used to stop `pytest` from running
  # at all — the job reported red for a formatting issue while real test
  # failures sat undiscovered behind it. That is how twelve tests depending on
  # untracked machine-local state survived: CI is a clean clone and would have
  # caught every one, but it never reached them. `always()` keeps each gate
  # independently reported; any failure still fails the job.
  lint-and-test:
    name: Lint + Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Setup uv for dependency-lock validation
        if: matrix.python-version == '3.11'
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.25"

      - name: Dependency lock is reproducible
        if: matrix.python-version == '3.11'
        run: uv lock --check

      - name: Install package
        run: pip install -e ".[dev,web,serve,discord]"

      - name: Invariant lint (active rules)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always()
        run: python -m tools.lint.invariant_check runtime/ tests/

      - name: Fixture visibility (no test input hidden by .gitignore)
        if: always()
        run: python -m tools.lint.fixture_visibility_check

      - name: Skill package dedup
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always()
        run: python tools/lint/skill_dedup_check.py --strict

      - name: Skill cross-dir dedup (all_skills vs skills/public ratchet)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always()
        run: python tools/lint/skill_cross_dir_check.py --strict

      - name: Protocol method drift (ServerMethod ↔ reducer.ts)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always()
        run: python tools/lint/protocol_method_drift.py --strict

      - name: "Exception audit (no NEW unjustified silent except: pass)"
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always()
        run: python tools/lint/exception_audit.py --strict

      - name: God-file check (no NEW files ≥1000 lines)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always()
        run: python tools/lint/god_file_check.py --strict

      - name: Import-direction ratchet (no NEW kernel→sensing/web imports)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always()
        run: python tools/lint/import_direction_check.py --strict

      - name: Orphan-module ratchet (no NEW exported-but-unimported modules)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always()
        run: python tools/lint/orphan_module_check.py --strict

      - name: Feature-flag-consumption ratchet (no NEW registered-but-unread flags)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always()
        run: python tools/lint/feature_flag_consumption_check.py --strict

      - name: Async-lock ratchet (no NEW await held across a sync lock)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always()
        run: python tools/lint/async_lock_check.py --strict

      - name: Async-blocking ratchet (no NEW blocking call in async flow)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always()
        run: python tools/lint/async_blocking_check.py --strict

      - name: Root hygiene (matches ROOT_LAYOUT.md allow-list)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always()
        run: python tools/lint/root_hygiene.py --strict

      - name: Repo URL consistency (matches pyproject.toml source of truth)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always()
        run: python tools/lint/repo_url_check.py --strict

      - name: Desktop-core deps (Electron bootstrap matches pyproject extras)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always()
        run: python tools/lint/desktop_core_sync_check.py --strict

      - name: Test-count freshness (no stale "3800+" in roadmap)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always()
        run: python tools/lint/count_tests.py --check

      - name: Doc-claim drift (organ/protocol counts match filesystem)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always()
        run: python tools/lint/doc_claims_check.py --strict

      - name: Auth-actor ratchet (no NEW bare _auth calls)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always()
        run: python tools/lint/auth_actor_check.py --strict

      - name: Hardcoded user paths (block per-user absolute paths in source)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always()
        run: python tools/lint/hardcoded_path_check.py --strict

      - name: mypy ratchet (no NEW static-type errors on hot packages)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always()
        run: python tools/lint/mypy_ratchet.py

      - name: Ruff check
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always()
        run: ruff check runtime/ tests/ tools/

      - name: Ruff format check
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always()
        run: ruff format --check runtime/ tests/ tools/

      - name: pytest (with coverage)
        # Correctness signal: never gated behind the style ratchets above.
        if: always()
        run: pytest --cov=runtime --cov=tools --cov-report=term --cov-fail-under=75

      - name: Large-corpus replay latency gate
        if: always()
        run: >-
          python -m runtime.safety.evolution.replay_latency_budget
          --corpus-size 2000
          --candidate-count 16
          --max-latency-ms 3000
          --max-evaluation-us 250
          --output test-results/replay-latency-budget.json

      - name: Upload replay latency proof
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: replay-latency-proof
          path: test-results/replay-latency-budget.json
          if-no-files-found: error

      - name: Production readiness gate
        if: always()
        env:
          OCTOPUS_READINESS_HOME: ${{ runner.temp }}/octopus-readiness
          OCTOPUS_READINESS_DATA_DIR: ${{ runner.temp }}/octopus-readiness/data
          OCTOPUS_READINESS_REPORT: ${{ runner.temp }}/octopus-readiness/readiness_gate.json
        run: make production-readiness

      - name: Upload production readiness proof
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-proof
          path: ${{ runner.temp }}/octopus-readiness/readiness_gate.json
          if-no-files-found: error

      - name: Golden-path gate (plan→execute→replan→verify, incl. parallel/recovery)
        if: always()
        run: pytest tests/test_golden_path_e2e.py tests/test_ganglia_runtime.py -v --tb=short

      - name: Delegation regression gate (timeout/fallback/retry/smart-budget)
        if: always()
        run: pytest tests/test_delegation_enhancements.py tests/test_delegation_smart_budget.py -v --tb=short

      - name: Security regression gate (team_tasks authorization)
        if: always()
        run: pytest tests/test_team_tasks_router_security.py -v --tb=short

      - name: Security regression gate (team_rooms authorization)
        if: always()
        run: pytest tests/test_team_rooms_router_security.py -v --tb=short

      - name: Security regression gate (parallel_agents ownership)
        if: always()
        run: pytest tests/test_parallel_agents_router_security.py -v --tb=short

      - name: Security regression gate (channels admin)
        if: always()
        run: pytest tests/test_channels_router_security.py -v --tb=short

      - name: Security regression gate (agents admin)
        if: always()
        run: pytest tests/test_agents_router_security.py -v --tb=short

      - name: Security regression gate (thread ownership)
        if: always()
        run: pytest tests/test_agents_router_thread_ownership.py -v --tb=short

      - name: Security regression gate (LocalPartner admin + alias)
        if: always()
        run: pytest tests/test_agents_router_local_partner_security.py -v --tb=short

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  pytest-cross-platform:
    # Catches path-separator, encoding, and permission bugs that only
    # surface off-Linux. Runs the test suite (no lint, no coverage)
    # on Windows + macOS as a sanity floor. Tagged ``not slow`` to
    # keep the matrix runtime sane — full battery still gates on
    # the linux ``lint-and-test`` job above.
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: pip install -e ".[dev,web,serve]"
      - name: pytest (fast subset)
        run: pytest -m "not slow and not integration" --tb=short -q

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install bandit pip-audit
      - name: Bandit SAST (zero MEDIUM+ severity findings)
        # MEDIUM and HIGH severity are enforced at zero. All findings
        # were either fixed at the source or given justified inline
        # nosec markers with a reason comment.
        run: bandit -r runtime/ -ll -ii
      - name: pip-audit
        # Paramiko 4.0.0 has no fixed release for PYSEC-2026-2858; both
        # Paramiko connection paths disable ssh-rsa/SHA-1 explicitly. The
        # exception is documented and time-bounded in docs/security/.
        run: pip install -e ".[dev,web,serve]" && pip-audit --ignore-vuln PYSEC-2026-2858

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: ESLint
        working-directory: frontend
        # No `|| true`: the gate must fail on real errors. The tree is
        # error-clean today (5 pre-existing warnings as of 2026-07-28,
        # measured via `pnpm exec eslint . --ext .ts,.tsx` — they don't
        # gate because eslint exits 0 on warnings-only). Add
        # `--max-warnings N` later to ratchet the warning debt down.
        run: pnpm exec eslint . --ext .ts,.tsx
      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Unit tests
        working-directory: frontend
        run: pnpm test
      - name: Build
        working-directory: frontend
        run: pnpm build

  pr-scale-guard:
    # Warns (and hard-fails beyond a larger threshold) when a PR touches
    # too many files / lines. Aligns with the "收紧提交粒度" (commit
    # granularity) goal in .trae/specs/scale-focus-control/spec.md Delta 2.
    name: PR scale guard (files / lines)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR size against base
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const pr = context.payload.pull_request;
            const base = pr.base.sha;
            const head = pr.head.sha;
            const out = execSync(`git diff --numstat ${base} ${head}`, { encoding: 'utf8' });
            const entries = out.split('\n').filter((l) => l.trim());
            const numFiles = entries.length;
            let insertions = 0;
            let deletions = 0;
            for (const e of entries) {
              const [a, d] = e.split('\t');
              if (a !== '-') insertions += parseInt(a, 10) || 0;
              if (d !== '-') deletions += parseInt(d, 10) || 0;
            }
            const totalLines = insertions + deletions;
            const warnFiles = 200;
            const failFiles = 500;
            const warnLines = 5000;
            if (numFiles > failFiles) {
              core.setFailed(
                `PR touches ${numFiles} files (hard limit ${failFiles}) — too large to review; please split into focused PRs.`
              );
            } else if (numFiles > warnFiles) {
              core.warning(
                `PR touches ${numFiles} files (soft limit ${warnFiles}) — keep an eye on reviewability.`
              );
            }
            if (totalLines > warnLines) {
              core.warning(
                `PR changes ${totalLines} lines (${insertions}+ / ${deletions}-) — soft limit ${warnLines}; consider splitting.`
              );
            }
            core.info(
              `PR scale: ${numFiles} files, ${totalLines} lines (${insertions} insertions, ${deletions} deletions).`
            );

  full-stack-smoke:
    name: Full-stack browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend dependencies
        run: pip install -e ".[dev,serve,web]"
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: FastAPI + Vite smoke
        run: bash scripts/verify_local.sh --full-stack-only

      - name: Upload full-stack smoke proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-smoke-proof
          path: test-results/local-verify-state/full_stack_smoke_proof.json
          if-no-files-found: error

      - name: Upload E2E release proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-release-proof
          path: test-results/local-verify-state/e2e_release_proof.json
          if-no-files-found: error

  docker-build:
    name: Docker build test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t octopus-agent-ci .

  tracing-smoke:
    name: Tracing smoke test (with OTel installed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev,tracing]"
      - run: pytest tests/test_tracing.py -v

  cli-smoke:
    name: CLI argparse wiring smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev,serve,web,discord]"
      - name: CLI --help for every subcommand
        run: pytest tests/test_cli_smoke.py -v

  demos:
    name: End-to-end demos (bugfix/reflection/evolution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev,web,serve]"
      - name: Git identity for commit demos
        run: |
          git config --global user.email "ci@octopus-agent.test"
          git config --global user.name "octopus-ci"
      - name: Run demo tests
        run: pytest tests/test_bugfix_demo.py tests/test_reflection_demo.py tests/test_evolution_demo.py -v

  openapi-contract:
    name: OpenAPI schema + TS types contract gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pip install -e ".[dev,serve]"

      - name: Regenerate OpenAPI snapshot
        run: OCTOPUS_OPENAPI_WRITE=1 pytest tests/test_openapi_snapshot.py -q

      - name: Assert snapshot is committed
        run: |
          if ! git diff --exit-code docs/openapi-snapshot.json; then
            echo "::error::docs/openapi-snapshot.json is stale · run 'make openapi-snapshot' locally and commit the diff"
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Regenerate TS types
        working-directory: frontend
        run: pnpm exec openapi-typescript ../docs/openapi-snapshot.json -o src/core/api/openapi-types.ts

      - name: Assert TS types are committed
        run: |
          if ! git diff --exit-code frontend/src/core/api/openapi-types.ts; then
            echo "::error::frontend/src/core/api/openapi-types.ts is stale · run 'make frontend-types' locally and commit the diff"
            exit 1
          fi
