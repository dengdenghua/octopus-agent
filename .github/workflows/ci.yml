name: CI

on:
  push:
    # Keep the long-lived hardening branch under the same release gates as main.
    branches: [main, codex/production-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every gate below carries `if: always()` on purpose. Steps run in order and
  # a failing step normally skips the rest, so one red style ratchet (the
  # god-file line-count check, a ruff nit) used to stop `pytest` from running
  # at all — the job reported red for a formatting issue while real test
  # failures sat undiscovered behind it. That is how twelve tests depending on
  # untracked machine-local state survived: CI is a clean clone and would have
  # caught every one, but it never reached them. `always()` keeps each gate
  # independently reported; any failure still fails the job.
  lint-and-test:
    name: Lint + Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11.9", "3.12.11"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Dependency lock is reproducible
        if: matrix.python-version == '3.11.9'
        run: uv lock --check

      - name: Install locked package
        env:
          UV_PYTHON_DOWNLOADS: never
        run: >-
          uv sync --locked --python ${{ matrix.python-version }}
          --extra dev --extra web --extra serve --extra discord

      - name: Activate locked environment
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            echo "${GITHUB_WORKSPACE}/.venv/Scripts" >> "${GITHUB_PATH}"
          else
            echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"
          fi

      - name: Invariant lint (active rules)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always() && matrix.python-version == '3.11.9'
        run: python -m tools.lint.invariant_check runtime/ tests/

      - name: Fixture visibility (no test input hidden by .gitignore)
        if: always() && matrix.python-version == '3.11.9'
        run: python -m tools.lint.fixture_visibility_check

      - name: Skill package dedup
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always() && matrix.python-version == '3.11.9'
        run: python tools/lint/skill_dedup_check.py --strict

      - name: Skill cross-dir dedup (all_skills vs skills/public ratchet)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always() && matrix.python-version == '3.11.9'
        run: python tools/lint/skill_cross_dir_check.py --strict

      - name: Protocol method drift (ServerMethod ↔ reducer.ts)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always() && matrix.python-version == '3.11.9'
        run: python tools/lint/protocol_method_drift.py --strict

      - name: "Exception audit (no NEW unjustified silent except: pass)"
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always() && matrix.python-version == '3.11.9'
        run: python tools/lint/exception_audit.py --strict

      - name: God-file check (no NEW files ≥1000 lines)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always() && matrix.python-version == '3.11.9'
        run: python tools/lint/god_file_check.py --strict

      - name: Import-direction ratchet (no NEW kernel→sensing/web imports)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always() && matrix.python-version == '3.11.9'
        run: python tools/lint/import_direction_check.py --strict

      - name: Orphan-module ratchet (no NEW exported-but-unimported modules)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always() && matrix.python-version == '3.11.9'
        run: python tools/lint/orphan_module_check.py --strict

      - name: Feature-flag-consumption ratchet (no NEW registered-but-unread flags)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always() && matrix.python-version == '3.11.9'
        run: python tools/lint/feature_flag_consumption_check.py --strict

      - name: Async-lock ratchet (no NEW await held across a sync lock)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always() && matrix.python-version == '3.11.9'
        run: python tools/lint/async_lock_check.py --strict

      - name: Async-blocking ratchet (no NEW blocking call in async flow)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always() && matrix.python-version == '3.11.9'
        run: python tools/lint/async_blocking_check.py --strict

      - name: Root hygiene (matches ROOT_LAYOUT.md allow-list)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always() && matrix.python-version == '3.11.9'
        run: python tools/lint/root_hygiene.py --strict

      - name: Repo URL consistency (matches pyproject.toml source of truth)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always() && matrix.python-version == '3.11.9'
        run: python tools/lint/repo_url_check.py --strict

      - name: Desktop-core deps (Electron bootstrap matches pyproject extras)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always() && matrix.python-version == '3.11.9'
        run: python tools/lint/desktop_core_sync_check.py --strict

      - name: Test-count freshness (no stale "3800+" in roadmap)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always() && matrix.python-version == '3.11.9'
        run: python tools/lint/count_tests.py --check

      - name: Doc-claim drift (organ/protocol counts match filesystem)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always() && matrix.python-version == '3.11.9'
        run: python tools/lint/doc_claims_check.py --strict

      - name: Auth-actor ratchet (no NEW bare _auth calls)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always() && matrix.python-version == '3.11.9'
        run: python tools/lint/auth_actor_check.py --strict

      - name: Hardcoded user paths (block per-user absolute paths in source)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always() && matrix.python-version == '3.11.9'
        run: python tools/lint/hardcoded_path_check.py --strict

      - name: mypy ratchet (no NEW static-type errors on hot packages)
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always() && matrix.python-version == '3.11.9'
        run: python tools/lint/mypy_ratchet.py

      - name: Ruff check
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always() && matrix.python-version == '3.11.9'
        run: ruff check runtime/ tests/ tools/

      - name: Ruff format check
        # Style/ratchet gate: must not mask pytest below (see note at job top).
        if: always() && matrix.python-version == '3.11.9'
        run: ruff format --check runtime/ tests/ tools/

      - name: pytest (full suite with coverage)
        # The complete suite and coverage gate run once. Python 3.12 exercises
        # a focused compatibility lane below instead of duplicating ~15k tests.
        if: always() && matrix.python-version == '3.11.9'
        # Release coverage measures the shippable runtime. Developer-only
        # tools are exercised by this suite and the explicit lint ratchets,
        # but mixing their platform-dependent CLI entrypoints into this
        # percentage made the production gate non-reproducible.
        run: pytest --cov=runtime --cov-report=term --cov-fail-under=77.5

      - name: pytest collection compatibility (Python 3.12)
        # Import every test module to catch syntax and dependency drift cheaply.
        if: always() && matrix.python-version == '3.12.11'
        run: pytest --collect-only -q

      - name: pytest compatibility smoke (Python 3.12)
        # Representative config, CLI, async, core-loop, and API contracts.
        if: always() && matrix.python-version == '3.12.11'
        run: >-
          pytest --tb=short -q
          tests/test_config.py
          tests/test_cli_smoke.py
          tests/test_golden_path_e2e.py
          tests/test_react_core_path_e2e.py
          tests/test_tentacle_dashboard.py
          tests/test_scheduler_runner_stop_coverage.py
          tests/test_openapi_snapshot.py

      - name: Large-corpus replay latency gate
        if: always() && matrix.python-version == '3.11.9'
        run: >-
          python -m runtime.safety.evolution.replay_latency_budget
          --corpus-size 2000
          --candidate-count 16
          --max-latency-ms 3000
          --max-evaluation-us 250
          --output test-results/replay-latency-budget.json

      - name: Upload replay latency proof
        if: always() && matrix.python-version == '3.11.9'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: replay-latency-proof
          path: test-results/replay-latency-budget.json
          if-no-files-found: error

      - name: Static-only readiness checks (not release proof)
        if: always() && matrix.python-version == '3.11.9'
        env:
          OCTOPUS_READINESS_HOME: ${{ runner.temp }}/octopus-readiness
          OCTOPUS_READINESS_DATA_DIR: ${{ runner.temp }}/octopus-readiness/data
          OCTOPUS_READINESS_REPORT: ${{ runner.temp }}/octopus-readiness/readiness_static.json
        run: make production-readiness-static

      - name: Upload static readiness report (not release proof)
        if: always() && matrix.python-version == '3.11.9'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-readiness-static-report
          path: ${{ runner.temp }}/octopus-readiness/readiness_static.json
          if-no-files-found: error

      - name: Upload coverage
        if: matrix.python-version == '3.11.9'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: .coverage

  pytest-cross-platform:
    # Catches path-separator, encoding, permission, subprocess, CLI, and
    # desktop-packaging bugs that surface off Linux. The complete suite still
    # gates once in the Linux/Python 3.11 lane above.
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
        python-version: ["3.11.9"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked package
        env:
          UV_PYTHON_DOWNLOADS: never
        run: >-
          uv sync --locked --python ${{ matrix.python-version }}
          --extra dev --extra web --extra serve
      - name: Activate locked environment
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            echo "${GITHUB_WORKSPACE}/.venv/Scripts" >> "${GITHUB_PATH}"
          else
            echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"
          fi
      - name: pytest (cross-platform subset)
        run: >-
          pytest --tb=short -q
          tests/test_platform_paths.py
          tests/test_path_guard.py
          tests/test_path_denylist.py
          tests/test_state_path_contracts.py
          tests/test_docs_encoding.py
          tests/test_browser_artifact.py
          tests/test_subprocess_backend.py
          tests/test_event_log_multiprocess.py
          tests/test_leader_process.py
          tests/test_process_timeline.py
          tests/test_config.py
          tests/test_cli.py
          tests/test_cli_smoke.py
          tests/test_atomic_io.py
          tests/test_asset_registry.py
          tests/test_workspaces.py
          tests/test_desktop_config_packaging.py
          tests/test_frontend_package_manager.py
          tests/test_narrative_desktop_packaging.py
          tests/test_narrative_mcp_and_packaged_skills.py

  security-scan:
    name: Security scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked security environment
        env:
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --locked --python 3.12.11 --extra dev --extra web --extra serve
      - name: Activate locked environment
        run: echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"
      - name: Bandit SAST (zero MEDIUM+ severity findings)
        # MEDIUM and HIGH severity are enforced at zero. All findings
        # were either fixed at the source or given justified inline
        # nosec markers with a reason comment.
        run: bandit -r runtime/ -ll -ii
      - name: pip-audit
        # The locked graph must be vulnerability-clean without suppressions.
        run: pip-audit

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend production dependency audit
        working-directory: frontend
        run: pnpm audit --prod
      - name: ESLint
        working-directory: frontend
        # No `|| true`: the gate must fail on real errors. The tree is
        # error-clean today (5 pre-existing warnings as of 2026-07-28,
        # measured via `pnpm exec eslint . --ext .ts,.tsx` — they don't
        # gate because eslint exits 0 on warnings-only). Add
        # `--max-warnings N` later to ratchet the warning debt down.
        run: pnpm exec eslint . --ext .ts,.tsx
      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Unit tests
        working-directory: frontend
        run: pnpm test
      - name: Build
        working-directory: frontend
        run: pnpm build

  pr-scale-guard:
    # Warns (and hard-fails beyond a larger threshold) when a PR touches
    # too many files / lines. Aligns with the "收紧提交粒度" (commit
    # granularity) goal in .trae/specs/scale-focus-control/spec.md Delta 2.
    name: PR scale guard (files / lines)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check PR size against base
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { execSync } = require('child_process');
            const pr = context.payload.pull_request;
            const base = pr.base.sha;
            const head = pr.head.sha;
            const out = execSync(`git diff --numstat ${base} ${head}`, { encoding: 'utf8' });
            const entries = out.split('\n').filter((l) => l.trim());
            const numFiles = entries.length;
            let insertions = 0;
            let deletions = 0;
            for (const e of entries) {
              const [a, d] = e.split('\t');
              if (a !== '-') insertions += parseInt(a, 10) || 0;
              if (d !== '-') deletions += parseInt(d, 10) || 0;
            }
            const totalLines = insertions + deletions;
            const warnFiles = 200;
            const failFiles = 500;
            const warnLines = 5000;
            if (numFiles > failFiles) {
              core.setFailed(
                `PR touches ${numFiles} files (hard limit ${failFiles}) — too large to review; please split into focused PRs.`
              );
            } else if (numFiles > warnFiles) {
              core.warning(
                `PR touches ${numFiles} files (soft limit ${warnFiles}) — keep an eye on reviewability.`
              );
            }
            if (totalLines > warnLines) {
              core.warning(
                `PR changes ${totalLines} lines (${insertions}+ / ${deletions}-) — soft limit ${warnLines}; consider splitting.`
              );
            }
            core.info(
              `PR scale: ${numFiles} files, ${totalLines} lines (${insertions} insertions, ${deletions} deletions).`
            );

  full-stack-smoke:
    name: Full-stack browser smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend dependencies
        env:
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --locked --python 3.11.9 --extra dev --extra serve --extra web
      - name: Activate locked backend environment
        run: echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: FastAPI + Vite smoke
        env:
          OCTOPUS_VERIFY_SKIP_PRODUCTION_GATE: "1"
        run: bash scripts/verify_local.sh --full-stack-only

      - name: Upload full-stack smoke proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-stack-smoke-proof-${{ github.sha }}
          path: test-results/local-verify-state
          if-no-files-found: error

  docker-build:
    name: Docker build test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build Docker image
        run: docker build -t octopus-agent-ci .
      - name: Smoke installed image and bundled skill catalog
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python octopus-agent-ci -c \
            "from runtime.safety.sandboxing.sandbox import resolve_process_backend; choice = resolve_process_backend('strict'); assert choice.hard, choice"
          container="octopus-agent-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker inspect --format '{{json .State}}' "${container}" || true
            docker logs "${container}" || true
            docker rm --force "${container}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name "${container}" \
            --volume "${PWD}/tests/fixtures/docker_smoke_config.yaml:/etc/octopus/docker-smoke.yaml:ro" \
            octopus-agent-ci serve --config /etc/octopus/docker-smoke.yaml \
            --host 127.0.0.1 --port 8000
          ready=0
          for _ in $(seq 1 60); do
            if [[ "$(docker inspect --format '{{.State.Running}}' "${container}")" != "true" ]]; then
              echo "production container exited before readiness" >&2
              exit 1
            fi
            if docker exec "${container}" python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"; then
              ready=1
              break
            fi
            sleep 1
          done
          test "${ready}" = "1"
          docker exec "${container}" python -c \
            "import json, urllib.request; payload=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)); assert payload['skills'] >= 3, payload"

  tracing-smoke:
    name: Tracing smoke test (with OTel installed)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11.9"}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with: {version: "0.11.25", enable-cache: true, cache-dependency-glob: uv.lock}
      - run: uv sync --locked --python 3.11.9 --extra dev --extra tracing
        env: {UV_PYTHON_DOWNLOADS: never}
      - run: echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"
      - run: pytest tests/test_tracing.py -v

  cli-smoke:
    name: CLI argparse wiring smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11.9"}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with: {version: "0.11.25", enable-cache: true, cache-dependency-glob: uv.lock}
      - run: >-
          uv sync --locked --python 3.11.9
          --extra dev --extra serve --extra web --extra discord
        env: {UV_PYTHON_DOWNLOADS: never}
      - run: echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"
      - name: CLI --help for every subcommand
        run: pytest tests/test_cli_smoke.py -v

  demos:
    name: End-to-end demos (bugfix/reflection/evolution)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11.9"}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with: {version: "0.11.25", enable-cache: true, cache-dependency-glob: uv.lock}
      - run: uv sync --locked --python 3.11.9 --extra dev --extra web --extra serve
        env: {UV_PYTHON_DOWNLOADS: never}
      - run: echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"
      - name: Git identity for commit demos
        run: |
          git config --global user.email "ci@octopus-agent.test"
          git config --global user.name "octopus-ci"
      - name: Run demo tests
        run: pytest tests/test_bugfix_demo.py tests/test_reflection_demo.py tests/test_evolution_demo.py -v

  openapi-contract:
    name: OpenAPI schema + TS types contract gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11.9"}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with: {version: "0.11.25", enable-cache: true, cache-dependency-glob: uv.lock}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --locked --python 3.11.9 --extra dev --extra serve --extra web
        env: {UV_PYTHON_DOWNLOADS: never}
      - run: echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Regenerate OpenAPI snapshot
        run: OCTOPUS_OPENAPI_WRITE=1 pytest tests/test_openapi_snapshot.py -q

      - name: Assert snapshot is committed
        run: |
          if ! git diff --exit-code docs/openapi-snapshot.json; then
            echo "::error::docs/openapi-snapshot.json is stale · run 'make openapi-snapshot' locally and commit the diff"
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Regenerate TS types
        working-directory: frontend
        run: pnpm exec openapi-typescript ../docs/openapi-snapshot.json -o src/core/api/openapi-types.ts

      - name: Assert TS types are committed
        run: |
          if ! git diff --exit-code frontend/src/core/api/openapi-types.ts; then
            echo "::error::frontend/src/core/api/openapi-types.ts is stale · run 'make frontend-types' locally and commit the diff"
            exit 1
          fi
