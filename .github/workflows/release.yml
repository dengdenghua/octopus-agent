name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-image:
    name: Build and push image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract tag name
        id: tag
        run: echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Lowercase repository name for GHCR
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.tag.outputs.name }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create draft GitHub Release
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract tag name
        id: tag
        run: |
          raw="${GITHUB_REF#refs/tags/}"
          echo "raw=${raw}" >> "$GITHUB_OUTPUT"
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section for ${{ steps.tag.outputs.version }}
        id: changelog
        run: |
          version="${{ steps.tag.outputs.version }}"
          # Extract the section starting at "## [<version>]" up to the next "## [" heading.
          awk -v v="${version}" '
            BEGIN { in_section = 0 }
            /^## \[/ {
              if (in_section) { exit }
              if (index($0, "[" v "]") > 0) { in_section = 1; print; next }
            }
            in_section { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "::warning::No CHANGELOG.md section found for version ${version}"
            printf 'Release %s. See CHANGELOG.md for details.\n' "${version}" > release_notes.md
          fi
          echo "path=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.raw }}
          name: ${{ steps.tag.outputs.raw }}
          body_path: ${{ steps.changelog.outputs.path }}
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
