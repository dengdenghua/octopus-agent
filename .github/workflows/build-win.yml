name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: win-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win:
    name: Build Windows EXE
    runs-on: windows-2025
    # Production signing credentials live only in this protected environment.
    # Configure required reviewers in GitHub; a missing secret fails before build work.
    environment: windows-code-signing
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      OCTOPUS_SOURCEMAP: "0"
      OCTOPUS_WINDOWS_TIMESTAMP_URL: http://timestamp.digicert.com
      UV_PYTHON_DOWNLOADS: never
      CI: "true"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate protected Windows signing identity
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            throw "Protected secret WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 is required"
          }
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw "Protected secret WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD is required"
          }

          try {
            $certificateBytes = [Convert]::FromBase64String(($env:CSC_LINK -replace '\s', ''))
            $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
            $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $certificateBytes,
              $env:CSC_KEY_PASSWORD,
              $flags
            )
          } catch {
            throw "Windows signing certificate is not a password-protected base64 PKCS#12 bundle: $($_.Exception.Message)"
          }

          try {
            if (-not $certificate.HasPrivateKey) {
              throw "Windows signing certificate does not contain a private key"
            }
            $codeSigningOid = "1.3.6.1.5.5.7.3.3"
            $hasCodeSigningEku = $false
            foreach ($extension in $certificate.Extensions) {
              if ($extension -is [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]) {
                foreach ($usage in $extension.EnhancedKeyUsages) {
                  if ($usage.Value -eq $codeSigningOid) {
                    $hasCodeSigningEku = $true
                  }
                }
              }
            }
            if (-not $hasCodeSigningEku) {
              throw "Windows signing certificate is missing the Code Signing EKU"
            }
            $now = (Get-Date).ToUniversalTime()
            if ($certificate.NotBefore.ToUniversalTime() -gt $now -or $certificate.NotAfter.ToUniversalTime() -le $now) {
              throw "Windows signing certificate is not currently valid"
            }
            $publisherBytes = [Text.Encoding]::UTF8.GetBytes($certificate.Subject)
            "OCTOPUS_WINDOWS_SIGNER_THUMBPRINT=$($certificate.Thumbprint)" | Out-File `
              -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "OCTOPUS_WINDOWS_SIGNER_SUBJECT_BASE64=$([Convert]::ToBase64String($publisherBytes))" | Out-File `
              -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } finally {
            if ($null -ne $certificate) { $certificate.Dispose() }
          }

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"

      - name: Setup pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked desktop build dependencies
        run: >-
          uv sync --locked --python 3.11.9
          --extra desktop-core
          --extra desktop-build

      - name: Configure trusted first-party plugin publisher
        shell: pwsh
        env:
          OCTOPUS_PLUGIN_SIGNING_PUBLIC_KEY: ${{ vars.OCTOPUS_PLUGIN_SIGNING_PUBLIC_KEY }}
          OCTOPUS_PLUGIN_SIGNING_PUBLISHER_ID: ${{ vars.OCTOPUS_PLUGIN_SIGNING_PUBLISHER_ID }}
          OCTOPUS_PLUGIN_SIGNING_KEY_ID: ${{ vars.OCTOPUS_PLUGIN_SIGNING_KEY_ID }}
        run: ./.venv/Scripts/python.exe scripts/configure_builtin_plugin_publisher.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Prepare pinned Codex Windows runtime
        working-directory: frontend
        run: pnpm codex:prepare:win

      - name: Verify pinned Codex before packaging
        shell: pwsh
        run: |
          $codexRoot = Join-Path $PWD "extras/desktop/build/codex"
          $codex = Join-Path $codexRoot "bin/codex.exe"
          $manifestPath = Join-Path $codexRoot "octopus-codex-bundle.json"
          if (-not (Test-Path -LiteralPath $codex -PathType Leaf)) {
            throw "Pinned Codex executable is missing: $codex"
          }
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Pinned Codex bundle manifest is missing: $manifestPath"
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.schema -ne "octopus.codex_bundle.v1" -or
              $manifest.package -ne "@openai/codex" -or
              $manifest.version -ne "0.149.0" -or
              $manifest.platformPackageIntegrity -ne "sha512-qKbwSOOO/fdhQ5MlXE2fts6taPxRPZ/zqeC+eqHD72hLRymV9rFCUbUxOCquognUPRPvS/2/kRCV0UVhoDd3yQ==" -or
              $manifest.target -ne "x86_64-pc-windows-msvc" -or
              $manifest.fileHashPhase -ne "pre-authenticode") {
            throw "Pinned Codex bundle manifest is invalid"
          }
          if ($manifest.licenses.codex.version -ne "0.149.0" -or
              $manifest.licenses.codex.sourceTag -ne "rust-v0.149.0" -or
              $manifest.licenses.codex.sourceCommit -ne "758ef40f50c1a458425c7cfbf1eb12cbc07af0b0" -or
              $manifest.licenses.codex.cargoLockSha256 -ne "0c32858e9c47d0acf82735c8620c96840a5381152eec63acad15d1acadb9edad" -or
              $manifest.licenses.codex.cargoAboutVersion -ne "0.9.2" -or
              $manifest.licenses.native.schemaVersion -ne "codex-native-notices.v1" -or
              $manifest.licenses.native.provenanceSha256 -ne "65e2c0c7f7b239ee758133ce17cfb680bc38aec84876ca81015458c41a988c7a" -or
              $manifest.licenses.native.noticeSha256 -ne "da7997facd0e36f4ebca01594c60abdc1204f5421a35d28c4760b13addf247c5" -or
              $manifest.licenses.native.componentCount -ne 12 -or
              $manifest.licenses.native.licenseInputCount -ne 80 -or
              $manifest.licenses.ratatui.version -ne "0.30.2" -or
              $manifest.licenses.ratatui.crateSha256 -ne "3274ba0a2c5e1bcad2a2005d20f4dc59dad26b2eb0940fb094500dba4099d57d" -or
              $manifest.licenses.ripgrep.version -ne "15.2.0" -or
              $manifest.licenses.ripgrep.sourceTag -ne "15.2.0" -or
              $manifest.licenses.ripgrep.sourceCommit -ne "e89fff89ac9af12e8d4ce9d5fd07beb408ca730f" -or
              $manifest.licenses.ripgrep.cargoLockSha256 -ne "7a7d39cda8a03930e578f1dbb724e055771901842eca239e03b01e19da946a64" -or
              $manifest.licenses.ripgrep.cargoAboutVersion -ne "0.9.2" -or
              $manifest.licenses.ripgrep.releaseFeatures.Count -ne 1 -or
              $manifest.licenses.ripgrep.releaseFeatures[0] -ne "pcre2" -or
              $manifest.licenses.ripgrep.windowsExecutableSha256 -ne "14231169855ec5205cf5a1b6f1db358ff4aed4247c86b69ce8aae647c77f6680" -or
              $manifest.licenses.ripgrep.windowsArchiveSha256 -ne "71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5") {
            throw "Pinned Codex third-party source manifest is invalid"
          }

          $requiredCodexFiles = @(
            "bin/codex.exe",
            "bin/codex-code-mode-host.exe",
            "codex-resources/codex-command-runner.exe",
            "codex-resources/codex-windows-sandbox-setup.exe",
            "codex-path/rg.exe",
            "codex-package.json",
            "LICENSE",
            "NOTICE",
            "third-party/codex-rust/THIRD_PARTY_LICENSES-codex-cli.html",
            "third-party/codex-rust/THIRD_PARTY_LICENSES-code-mode-host.html",
            "third-party/codex-rust/THIRD_PARTY_LICENSES-windows-sandbox.html",
            "third-party/codex-rust/THIRD_PARTY_LICENSES.md",
            "third-party/codex-native/NATIVE_PROVENANCE.json",
            "third-party/codex-native/NATIVE_THIRD_PARTY_NOTICES.md",
            "third-party/ratatui/LICENSE",
            "third-party/ripgrep/COPYING",
            "third-party/ripgrep/THIRD_PARTY_LICENSES.html",
            "third-party/ripgrep/THIRD_PARTY_LICENSES.md",
            "third-party/ripgrep/LICENSE-MIT",
            "third-party/ripgrep/UNLICENSE"
          )
          foreach ($relative in $requiredCodexFiles) {
            $file = Join-Path $codexRoot $relative
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Pinned Codex bundle file is missing: $relative"
            }
            $manifestProperty = $manifest.files.PSObject.Properties[$relative]
            $actualHash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($null -eq $manifestProperty -or $manifestProperty.Value -ne $actualHash) {
              throw "Pinned Codex bundle file does not match its source manifest: $relative"
            }
          }

          $expectedCodexExecutables = @(
            "bin/codex.exe",
            "bin/codex-code-mode-host.exe",
            "codex-path/rg.exe",
            "codex-resources/codex-command-runner.exe",
            "codex-resources/codex-windows-sandbox-setup.exe"
          ) | Sort-Object
          $actualCodexExecutables = @(
            Get-ChildItem -LiteralPath $codexRoot -Recurse -File -Filter "*.exe" |
              ForEach-Object { $_.FullName.Substring($codexRoot.Length + 1).Replace("\", "/") } |
              Sort-Object
          )
          if (@(Compare-Object $expectedCodexExecutables $actualCodexExecutables).Count -ne 0) {
            throw "Pinned Codex package executable inventory changed"
          }
          & $codex app-server --help
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned Codex App Server failed its pre-packaging startup check"
          }

      - name: Typecheck frontend
        working-directory: frontend
        run: pnpm typecheck

      - name: Build backend (PyInstaller)
        working-directory: extras/desktop
        env:
          PYTHON_EXE: ${{ github.workspace }}\.venv\Scripts\python.exe
        run: pnpm backend:build:win

      - name: Verify PyInstaller backend before packaging
        shell: pwsh
        run: |
          $backend = Join-Path $PWD "extras/desktop/build/backend/octopus-backend.exe"
          if (-not (Test-Path -LiteralPath $backend -PathType Leaf)) {
            throw "PyInstaller backend is missing: $backend"
          }
          & $backend --help
          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller backend failed its pre-packaging startup check"
          }

      - name: Sync locked desktop test dependencies
        run: >-
          uv sync --locked --python 3.11.9
          --extra dev
          --extra desktop-core
          --extra desktop-build

      - name: Verify desktop first-launch and packaging contracts
        run: >-
          ./.venv/Scripts/python.exe -m pytest
          tests/test_desktop_config_packaging.py
          tests/test_desktop_core_sync.py
          -q

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Build canonical Electron EXE
        working-directory: frontend
        env:
          # electron-builder consumes these only for this signing step. They are
          # deliberately not job-wide, so setup and dependency actions cannot read them.
          CSC_LINK: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: pnpm electron:build:win

      - name: Verify packaged backend and Codex are present and runnable
        shell: pwsh
        run: |
          $backend = Join-Path $PWD "frontend/release/win-unpacked/resources/backend/octopus-backend.exe"
          $codexRoot = Join-Path $PWD "frontend/release/win-unpacked/resources/codex"
          $codex = Join-Path $codexRoot "bin/codex.exe"
          $codexManifestPath = Join-Path $codexRoot "octopus-codex-bundle.json"
          if (-not (Test-Path -LiteralPath $backend -PathType Leaf)) {
            throw "Packaged backend is missing: $backend"
          }
          if (-not (Test-Path -LiteralPath $codex -PathType Leaf)) {
            throw "Packaged Codex is missing: $codex"
          }
          if (-not (Test-Path -LiteralPath $codexManifestPath -PathType Leaf)) {
            throw "Packaged Codex manifest is missing: $codexManifestPath"
          }
          $codexManifest = Get-Content -LiteralPath $codexManifestPath -Raw | ConvertFrom-Json
          if ($codexManifest.licenses.native.schemaVersion -ne "codex-native-notices.v1" -or
              $codexManifest.licenses.native.provenanceSha256 -ne "65e2c0c7f7b239ee758133ce17cfb680bc38aec84876ca81015458c41a988c7a" -or
              $codexManifest.licenses.native.noticeSha256 -ne "da7997facd0e36f4ebca01594c60abdc1204f5421a35d28c4760b13addf247c5" -or
              $codexManifest.licenses.native.componentCount -ne 12 -or
              $codexManifest.licenses.native.licenseInputCount -ne 80) {
            throw "Packaged Codex native provenance manifest is invalid"
          }
          $packagedLicenseFiles = @(
            "LICENSE",
            "NOTICE",
            "third-party/codex-rust/THIRD_PARTY_LICENSES-codex-cli.html",
            "third-party/codex-rust/THIRD_PARTY_LICENSES-code-mode-host.html",
            "third-party/codex-rust/THIRD_PARTY_LICENSES-windows-sandbox.html",
            "third-party/codex-rust/THIRD_PARTY_LICENSES.md",
            "third-party/codex-native/NATIVE_PROVENANCE.json",
            "third-party/codex-native/NATIVE_THIRD_PARTY_NOTICES.md",
            "third-party/ratatui/LICENSE",
            "third-party/ripgrep/COPYING",
            "third-party/ripgrep/THIRD_PARTY_LICENSES.html",
            "third-party/ripgrep/THIRD_PARTY_LICENSES.md",
            "third-party/ripgrep/LICENSE-MIT",
            "third-party/ripgrep/UNLICENSE"
          )
          foreach ($relative in $packagedLicenseFiles) {
            $file = Join-Path $codexRoot $relative
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Packaged Codex license file is missing: $relative"
            }
            $manifestProperty = $codexManifest.files.PSObject.Properties[$relative]
            $actualHash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($null -eq $manifestProperty -or $manifestProperty.Value -ne $actualHash) {
              throw "Packaged Codex license hash changed: $relative"
            }
          }
          & $codex app-server --help
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged Codex App Server failed its startup check"
          }

          $smokeRoot = Join-Path $env:RUNNER_TEMP "octopus-packaged-backend-smoke"
          $config = Join-Path $smokeRoot "config.yaml"
          $mutableResources = Join-Path $smokeRoot "resources"
          $packagedResources = Join-Path $PWD "frontend/release/win-unpacked/resources"
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          node -e 'const m=require(process.argv[1]);m.ensureDesktopConfigFile({bundledPath:process.argv[2],targetPath:process.argv[3]});m.ensureDesktopResources({bundledRoot:process.argv[4],targetRoot:process.argv[5]});' `
            (Join-Path $PWD "frontend/electron/desktop-config.cjs") `
            (Join-Path $packagedResources "config.desktop.yaml") `
            $config $packagedResources $mutableResources
          if ($LASTEXITCODE -ne 0) {
            throw "Desktop first-launch materialization failed"
          }

          $env:OCTOPUS_DESKTOP = "1"
          $env:OCTOPUS_DATA_DIR = Join-Path $smokeRoot "data"
          $env:OCTOPUS_RESOURCES_DIR = $mutableResources
          $env:OCTOPUS_CODEX_EXECUTABLE = $codex
          $stdout = Join-Path $smokeRoot "backend.stdout.log"
          $stderr = Join-Path $smokeRoot "backend.stderr.log"
          $port = 18765
          $backendProcess = Start-Process -FilePath $backend `
            -ArgumentList @("serve", "--config", $config, "--host", "127.0.0.1", "--port", "$port") `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr `
            -NoNewWindow -PassThru
          $ready = $false
          try {
            $deadline = (Get-Date).AddSeconds(90)
            while ((Get-Date) -lt $deadline -and -not $backendProcess.HasExited) {
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:$port/readyz" `
                  -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                # The fixed backend is still starting; retry until the deadline.
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) {
              if (Test-Path $stdout) { Get-Content $stdout -Tail 200 }
              if (Test-Path $stderr) { Get-Content $stderr -Tail 200 }
              throw "Packaged backend did not reach /readyz"
            }
          } finally {
            if (-not $backendProcess.HasExited) {
              Stop-Process -Id $backendProcess.Id -Force
              Wait-Process -Id $backendProcess.Id -ErrorAction SilentlyContinue
            }
          }

      - name: Verify Authenticode signatures and create commit-bound checksums
        shell: pwsh
        run: |
          $releaseRoot = (Resolve-Path "frontend/release").Path
          $installerCandidates = @(
            Get-ChildItem -LiteralPath $releaseRoot -File -Filter "Octopus-Setup-*.exe"
          )
          if ($installerCandidates.Count -ne 1) {
            throw "Expected exactly one Octopus installer, found $($installerCandidates.Count)"
          }
          $installer = $installerCandidates[0]
          if (-not $installer.Name.Contains($env:GITHUB_SHA)) {
            throw "Installer filename is not bound to GITHUB_SHA: $($installer.Name)"
          }

          $signedFiles = [ordered]@{}
          $signedFiles[$installer.Name] = $installer.FullName
          $signedFiles["win-unpacked/Octopus.exe"] = Join-Path $releaseRoot "win-unpacked/Octopus.exe"
          $signedFiles["win-unpacked/resources/backend/octopus-backend.exe"] = `
            Join-Path $releaseRoot "win-unpacked/resources/backend/octopus-backend.exe"
          $signedFiles["win-unpacked/resources/codex/bin/codex.exe"] = `
            Join-Path $releaseRoot "win-unpacked/resources/codex/bin/codex.exe"
          $signedFiles["win-unpacked/resources/codex/bin/codex-code-mode-host.exe"] = `
            Join-Path $releaseRoot "win-unpacked/resources/codex/bin/codex-code-mode-host.exe"
          $signedFiles["win-unpacked/resources/codex/codex-resources/codex-command-runner.exe"] = `
            Join-Path $releaseRoot "win-unpacked/resources/codex/codex-resources/codex-command-runner.exe"
          $signedFiles["win-unpacked/resources/codex/codex-resources/codex-windows-sandbox-setup.exe"] = `
            Join-Path $releaseRoot "win-unpacked/resources/codex/codex-resources/codex-windows-sandbox-setup.exe"
          $signedFiles["win-unpacked/resources/codex/codex-path/rg.exe"] = `
            Join-Path $releaseRoot "win-unpacked/resources/codex/codex-path/rg.exe"

          $installerChecksumLine = $null
          $expectedSignerThumbprint = $null
          $expectedPublisher = $null
          if ([string]::IsNullOrWhiteSpace($env:OCTOPUS_WINDOWS_SIGNER_THUMBPRINT) -or
              [string]::IsNullOrWhiteSpace($env:OCTOPUS_WINDOWS_SIGNER_SUBJECT_BASE64)) {
            throw "Validated Windows signing publisher identity is missing"
          }
          $protectedPublisher = [Text.Encoding]::UTF8.GetString(
            [Convert]::FromBase64String($env:OCTOPUS_WINDOWS_SIGNER_SUBJECT_BASE64)
          )
          $proofFiles = @()
          foreach ($entry in $signedFiles.GetEnumerator()) {
            $path = [string]$entry.Value
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Signed release file is missing: $path"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Authenticode signature is not Valid for $($entry.Key): $($signature.Status)"
            }
            if ($null -eq $signature.SignerCertificate) {
              throw "Authenticode signer certificate is missing for $($entry.Key)"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Trusted RFC3161 timestamp is missing for $($entry.Key)"
            }
            $publisher = [string]$signature.SignerCertificate.Subject
            if ([string]::IsNullOrWhiteSpace($publisher)) {
              throw "Authenticode publisher is missing for $($entry.Key)"
            }
            if ($signature.SignerCertificate.Thumbprint -ne $env:OCTOPUS_WINDOWS_SIGNER_THUMBPRINT -or
                $publisher -ne $protectedPublisher) {
              throw "Authenticode publisher does not match the protected build identity for $($entry.Key)"
            }
            if ($null -eq $expectedSignerThumbprint) {
              $expectedSignerThumbprint = $signature.SignerCertificate.Thumbprint
            } elseif ($expectedSignerThumbprint -ne $signature.SignerCertificate.Thumbprint) {
              throw "Release executables were not signed by one consistent identity"
            }
            if ($null -eq $expectedPublisher) {
              $expectedPublisher = $publisher
            } elseif ($expectedPublisher -ne $publisher) {
              throw "Release executables were not signed by one consistent publisher"
            }

            $sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($entry.Key -eq $installer.Name) {
              $installerChecksumLine = "$sha256 *$($entry.Key)"
            }
            $proofFiles += [ordered]@{
              path = [string]$entry.Key
              sha256 = $sha256
              authenticodeStatus = [string]$signature.Status
              signerThumbprint = $signature.SignerCertificate.Thumbprint
              publisher = $publisher
              timestampThumbprint = $signature.TimeStamperCertificate.Thumbprint
              timestampSubject = [string]$signature.TimeStamperCertificate.Subject
            }
          }

          if ([string]::IsNullOrWhiteSpace($installerChecksumLine)) {
            throw "Installer checksum was not generated"
          }
          $installerChecksumLine | Set-Content `
            -LiteralPath (Join-Path $releaseRoot "SHA256SUMS") `
            -Encoding ascii
          [ordered]@{
            schema = "octopus.windows_signing_proof.v1"
            sourceRevision = $env:GITHUB_SHA
            timestampServer = $env:OCTOPUS_WINDOWS_TIMESTAMP_URL
            generatedAt = (Get-Date).ToUniversalTime().ToString("o")
            files = $proofFiles
          } | ConvertTo-Json -Depth 6 | Set-Content `
            -LiteralPath (Join-Path $releaseRoot "windows-signing-proof.json") `
            -Encoding utf8

      - name: List release artifacts
        working-directory: frontend/release
        run: |
          Get-ChildItem -Recurse | Select-Object FullName, Length
          Get-ChildItem -File | ForEach-Object { "{0:N1} MB`t{1}" -f ($_.Length / 1MB), $_.Name }

      - name: Upload EXE installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Octopus-Setup-Windows-${{ github.sha }}
          path: |
            frontend/release/Octopus-Setup-*.exe
            frontend/release/SHA256SUMS
            frontend/release/windows-signing-proof.json
            frontend/release/*.blockmap
            frontend/release/*.yml
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable (unpacked)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Octopus-Portable-Windows-${{ github.sha }}
          path: frontend/release/win-unpacked/**
