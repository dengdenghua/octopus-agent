apiVersion: v1
kind: ConfigMap
metadata:
  name: octopus-agent-config
  namespace: octopus-agent
data:
  config.yaml: |
    # Implementation note.
    # Implementation note.
    name: octopus-agent
    version_compat: "0.2"

    planner:
      type: llm
      model: mock/prod
      mock_response: |
        {"reasoning": "mock response · replace me in prod", "nodes": []}

    budget:
      max_tokens: 50000
      max_usd: 0.50

    journal_file: /data/events.jsonl

    # Cross-pod at-most-once tool effects. Readiness fails if Redis is
    # unreachable or this silently degrades to a pod-local backend.
    tool_effects:
      backend: redis
      redis_url: redis://:${REDIS_PASSWORD}@redis:6379/0
      key_prefix: "octopus:tool-effect:"
      require_distributed: true
