# Dedicated public-share vhost. This file is intentionally separate from
# deploy/echo-age.com.nginx.conf so enabling/reloading it cannot replace the
# existing ai/api/os.echo-age.com business routes.
#
# Prerequisites:
#   - DNS A/AAAA for share.echo-age.com points at this host.
#   - A certificate exists at the Let's Encrypt paths below (see
#     deploy/SHARE_RELAY.md for a no-downtime webroot flow).
#   - The static frontend is published to /var/www/octopus-share.
#   - cloud-edge-compose publishes the relay only on 127.0.0.1:8090.

# Per-IP limits protect the anonymous capability resolver and the authenticated
# management endpoints independently. These directives live in the HTTP
# context because sites-enabled files are included from nginx.conf's http {}.
limit_req_zone $binary_remote_addr zone=octopus_share_read_per_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=octopus_share_manage_per_ip:10m rate=2r/s;
# Deliberately omit $request, $request_uri, $args and Referer. Fixed API routes
# remain observable without persisting accidental capability query strings.
log_format octopus_share_safe '$remote_addr - $request_id [$time_local] '
                              '"$request_method $uri" $status $body_bytes_sent '
                              '"$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name share.echo-age.com;
    server_tokens off;
    access_log /var/log/nginx/share.echo-age.com.access.log octopus_share_safe;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # A legacy client may still place a capability/share id in the HTTP path
    # before following the redirect. Do not persist that first request either.
    location ~ ^/(?:api/(?:v1/)?public/thread-shares/|edge/v1/thread-shares/|api/cloud-edge/thread-shares/|s/) {
        access_log off;
        return 308 https://share.echo-age.com$request_uri;
    }

    location / {
        return 308 https://share.echo-age.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name share.echo-age.com;
    server_tokens off;
    access_log /var/log/nginx/share.echo-age.com.access.log octopus_share_safe;

    ssl_certificate /etc/letsencrypt/live/share.echo-age.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/share.echo-age.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OctopusShareTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/octopus-share;
    index index.html;
    client_max_body_size 2m;
    limit_req_status 429;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'" always;

    # Preferred anonymous read flow.  The capability token is sent in the JSON
    # body to keep it out of URLs, browser history and proxy access logs.  The
    # public-page route is translated to the Cloud Edge v1 route below; request
    # bodies are never included in the stock Nginx access log.
    location = /api/public/thread-shares/resolve {
        limit_req zone=octopus_share_read_per_ip burst=30 nodelay;
        rewrite ^ /api/v1/public/thread-shares/resolve break;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host share.echo-age.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # Direct v1 form of the same body-token endpoint.  Keep this exact location
    # above the legacy token-path prefix so /resolve is not treated as a token.
    location = /api/v1/public/thread-shares/resolve {
        limit_req zone=octopus_share_read_per_ip burst=30 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host share.echo-age.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # Legacy anonymous read. A capability token is part of the URL, so access
    # logging is disabled for the whole prefix. Do not replace this with a
    # normal combined access_log: it would persist the token in $request/$uri.
    location ^~ /api/v1/public/thread-shares/ {
        limit_req zone=octopus_share_read_per_ip burst=30 nodelay;
        access_log off;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host share.echo-age.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # Legacy pre-v1 token-path compatibility. Keep the same log protection
    # while translating it to the relay's v1 endpoint.
    location ^~ /api/public/thread-shares/ {
        limit_req zone=octopus_share_read_per_ip burst=30 nodelay;
        access_log off;
        rewrite ^/api/public/thread-shares/(.*)$ /api/v1/public/thread-shares/$1 break;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host share.echo-age.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # Authenticated desktop-device create/list/revoke API. The Cloud Edge
    # service validates its short-lived device Bearer token; Nginx never turns
    # this into a public unauthenticated write surface.
    location = /edge/v1/thread-shares {
        limit_req zone=octopus_share_manage_per_ip burst=10 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host share.echo-age.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
    }

    location ^~ /edge/v1/thread-shares/ {
        limit_req zone=octopus_share_manage_per_ip burst=10 nodelay;
        # The path may contain an internal share id. Treat it as sensitive
        # operational metadata and keep it out of access logs as well.
        access_log off;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host share.echo-age.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
    }

    # Account-authenticated path for the local Octopus server relay.  Cloud
    # Edge remains responsible for validating the account session/service
    # credential; this vhost only reserves and forwards the narrow route.
    location = /api/cloud-edge/thread-shares {
        limit_req zone=octopus_share_manage_per_ip burst=10 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host share.echo-age.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
    }

    location ^~ /api/cloud-edge/thread-shares/ {
        limit_req zone=octopus_share_manage_per_ip burst=10 nodelay;
        # A revoke/detail path may contain a share id. Keep it out of logs.
        access_log off;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host share.echo-age.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
    }

    # Future clean landing paths may contain the capability token. Hash-router
    # links do not reach the server, but this guard prevents accidental token
    # logging if /s/<token> is introduced later.
    location ^~ /s/ {
        access_log off;
        try_files $uri /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HashRouter share links request only /; the fragment remains in the
    # browser. This fallback also makes direct non-hash routes render the SPA.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
